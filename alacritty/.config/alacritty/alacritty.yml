#Janela
window:
  padding:
    x: 8
    y: 8
  class:
    instance: Alacritty
    general: Alacritty
  columns: 0
  lines: 0
  x: 0
  y: 0

#Decoração da janela
decorations: none


# Configuração de fonte

# Normal (Hack)
font:
  normal: 
    family: Hack Nerd Font Mono
    style: Regular
  bold:
    family: Hack Nerd Font Mono
    style: Bold
  italic:
    family: Hack Nerd Font Mono
    style: Italic
  bold_italic:
    family: Hack Nerd Font Mono
    style: Bold Italic
  size: 14.45


scrolling:
  history: 5000
  multiplier: 5
import:
  - ~/.config/alacritty/kanagawa-paper.yml
shell:
  program: /usr/bin/bash

#env:
# TERM: xterm-256color
  

