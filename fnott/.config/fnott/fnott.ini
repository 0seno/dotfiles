[main]
anchor=bottom-right
min-width=300
max-width=400
title-font=Hack Nerd Font:size=14
summary-font=Hack Nerd Font:size=14
body-font=Hack Nerd Font:size=13
default-timeout=5
idle-timeout=30
background=2A2A37ff
border-size=2
border-radius=6

# textos: fujiWhite (título/resumo) e oldWhite (corpo)
title-color=DCD7BAff
summary-color=DCD7BAff
body-color=C8C093ff

# barra de progresso: carpYellow sobre sumiInk6
progress-bar-color=E6C384ff

[low]
border-color=54546Dff
title-color=727169ff
summary-color=727169ff
body-color=727169ff

[normal]
border-color=938AA9ff

[critical]
border-color=C34043ff
background=43242Bff
layer=overlay
