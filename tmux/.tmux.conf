# Define o tipo de terminal
set -g default-terminal "alacritty"

# Habilita cores de 24 bits
#set -sa terminal-overrides ",xterm-256color:Tc"

# Configura o atraso da tecla ESC para 0ms
set -s escape-time 0

# Habilita o mouse
set -g mouse on

# Configura o tamanho do lado esquerdo da barra de status
set -g status-left-length 40

# Indice inicial de janelas e paineis
set -g base-index 1
set -g pane-base-index 1

run-shell "pulseaudio --check || pulseaudio --start"
set -g default-terminal "alacritty"
set -as terminal-features ",*:RGB"

set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

#set -g renumber-windows on
set -g status-style 'fg=#E1E1E1,bg=#171717'
set -g status-left '#{?client_prefix,#[bg=#586939]#[bold],}[#{session_name}]'
set -g status-left-style 'fg=#AFAFAF'
set -g window-status-format "#I:#W#{?window_flags,#{window_flags}, }"
set -g window-status-current-style 'fg=#aa759f,bold'
set -g window-status-style 'fg=#AFAFAF'
set -g status-right '%H:%M %d-%b-%y'
