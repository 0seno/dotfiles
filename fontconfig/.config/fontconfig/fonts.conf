<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- Sans-serif padrão -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>

  <alias>
    <family>sans</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>

  <!-- Serif (opcional, se quiser manter consistente) -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>

</fontconfig>
